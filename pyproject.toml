[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-commit-hooks"
version = "0.1.0"
description = "Static pre-commit hooks for Python projects."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Amir Douzandeh" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
check-model-docstrings = "pre_commit_hooks.check_model_docstrings:main"

[tool.setuptools.packages.find]
include = ["pre_commit_hooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py39"
